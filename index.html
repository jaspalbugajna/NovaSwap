        body {

            flex-direction: column;

            justify-content: center;
            min-height: 100vh;
        }

        .swap-card {
            background: #ffffff;
            border: 2px solid #eab308;

            padding: 24px;
            width: 420px;
            box-shadow: 0 12px 30px rgba(202, 138, 4, 0.15);

        }

        .swap-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .swap-header h2 {
            font-size: 20px;
            font-weight: 700;
            margin: 0;
        }

        .network-badge {

            color: #713f12;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
        }

        .swap-box {
            background: #fef9c3;
            border: 1px solid #fde047;
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 8px;
        }

        .swap-box-label {
            font-size: 14px;
            color: #854d0e;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
        }

        .swap-input-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .swap-input {
            background: transparent;
            border: none;
            font-size: 24px;
            font-weight: 600;
            color: #1e293b;
            width: 60%;
            outline: none;
        }

        .token-select-btn {

            border: 1px solid #ca8a04;
            border-radius: 20px;
            padding: 6px 12px;
            font-weight: 600;
            font-size: 14px;

            gap: 6px;
            color: #1e293b;
        }

        .switch-container {

            justify-content: center;
            margin: -4px 0;
            position: relative;
            z-index: 2;
        }

        .switch-btn {
            background: #ffffff;
            border: 2px solid #eab308;
            border-radius: 50%;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.2s;
            font-weight: bold;
            color: #ca8a04;
        }

        .switch-btn:hover {
            transform: rotate(180deg);
        }

        .swap-details {
            margin: 16px 0;
            font-size: 13px;
            color: #854d0e;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
        }

        .action-btn {
            background: #eab308;
            color: #ffffff;
            border: none;
            border-radius: 16px;
            width: 100%;
            padding: 16px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s;
            text-shadow: 0 1px 2px rgba(0,0,0,0.1);
        }

        .action-btn:hover {
            background: #ca8a04;
        }

        .connect-btn {
            background: #1e293b;
            color: white;
            margin-bottom: 12px;
        }

        /* Модальное окно */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.4);
            align-items: center;
            justify-content: center;
            z-index: 10;
        }
        .modal-content {
            background: white;
            padding: 24px;
            border-radius: 20px;
            width: 320px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }
        .token-item {
            padding: 10px 12px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .token-item:hover {
            background: #fef9c3;
        }
    </style>
</head>
